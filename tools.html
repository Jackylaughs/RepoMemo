<!DOCTYPE html>
<html lang="jp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ツール - M.E.M.O.</title>
    <meta name="description" content="REPOで気になったことを書き殴る">

    <link rel="stylesheet" href="styles/sanitize.css">
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/tools.css">
    <link rel="icon" href="images/favicon.svg" type="image/x-icon">

    <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
    <div class="scanlines"></div>
        <audio src="audio/repo_click.mp3" id="repo_click"></audio>
        <audio src="audio/repo_hover.mp3" id="repo_hover"></audio>
        
        <header class="repo_header"></header>

                    </tr>
