<!DOCTYPE html>
<html lang="jp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メモ - M.E.M.O.</title>
    <meta name="description" content="REPOで気になったことを書き殴る">

    <link rel="stylesheet" href="sanitize.css">
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="top.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@300..700&display=swap" rel="stylesheet">
</head>
<body>
    <svg id="barrel_map" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <filter id="displacement_filter" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
                <feImage
                    href="images/displacementmap_03.svg"
                    result="displacement_map"
                    preserveAspectRatio="none"/>
                <feDisplacementMap 
                    in="SourceGraphic"
                    in2="displacement_map"
                    scale="20"
                    xChannelSelector="R"
                    yChannelSelector="G"/>
            </filter>
        </defs>
    </svg>

    <div class="scanlines"></div>
    <audio src="./audio/repo_click.mp3" id="repo_click"></audio>
    <audio src="./audio/repo_hover.mp3" id="repo_hover"></audio>
    
    <div class="barrel">
    <header class="repo_header">
        <a href="index.html" class="repo_title text_en">M.E.M.O.</a>
        <button class="mute_switch muted"></button>
    </header>

    <div class="main_content"></div>
    </div>

    <script src="./global.js"></script>
</body>
</html>
